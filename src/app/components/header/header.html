<header>
  <nav class="navbar">
    <a routerLink="/" class="logo">My Store</a>

    <ul class="nav-links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
      <li><a routerLink="/cart" routerLinkActive="active">
        Cart
        <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </a></li>
      <li><a routerLink="/checkout" routerLinkActive="active">Checkout</a></li>
    </ul>
  </nav>
</header>
